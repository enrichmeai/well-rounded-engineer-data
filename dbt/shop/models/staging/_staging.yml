version: 2

models:
  - name: stg_customers
    description: One row per customer, cleaned from the raw seed.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_products
    description: One row per product.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: stg_orders
    description: One row per order. amount is NULL until the order is priced.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'delivered', 'cancelled']
